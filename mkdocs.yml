# ============================================================
# 站点基本信息
# ============================================================
site_name: DUT Drone Development Guide
site_url: https://qsq.cool
site_description: DUT Drone Development Guide
site_author: DUT Aeromodelling Association - Shengqiao Qu

# ============================================================
# 仓库与编辑链接
# ============================================================
repo_url: https://github.com/SIANQSQ/Drone_Task_Controller.git
repo_name: GitHub
edit_uri: blob/main/docs/

# ============================================================
# 主题配置 (Material for MkDocs)
# ============================================================
theme:
  name: material
  custom_dir: overrides
  language: zh

  # --- 颜色方案 ---
  palette:
    # 始终使用深色方案
    - scheme: slate
      primary: indigo
      accent: indigo

  # --- 字体设置 ---
  font:
    text: Roboto
    code: Roboto Mono

  # --- 界面功能 ---
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - header.autohide
    - toc.follow
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.tooltips

  # --- Material 主题图标 ---
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.svg
  favicon: favicon.ico

# ============================================================
# 导航结构
# ============================================================
nav:
  - 首页: index.md
  - 快速开始:
    - 环境部署: quickly_start/environment.md
    - 仿真: quickly_start/simulation.md
    - 实机: quickly_start/real_machine.md
  - 机械结构:
    - 机体结构: mechanical/airframe.md
    - 云台: mechanical/gimbal.md
    - 机载计算机: mechanical/onboard-computer.md
  - 硬件配置:
    
    - 无人机飞控硬件:
      - CUAV X25 EVO: hardware/flight_controller/cuav-x25-evo.md
    - 数传电台:
      - P8 数传: hardware/radio/telemetry-p8.md
      - P9 数传: hardware/radio/telemetry-p9.md
    - 传感器:
      - RTK:
        - CUAV 2HP RTK: hardware/flight_controller/2hp-rtk.md
        - CUAV 9PS RTK: hardware/flight_controller/9ps-rtk.md
      - 激光雷达: hardware/flight_controller/lidar.md
    - 执行器:
      - 舵机控制板: hardware/flight_controller/servo-controller.md
      - 舵机投放器: hardware/flight_controller/servo-dispenser.md
      - 电调: hardware/flight_controller/esc.md
      - 电机: hardware/flight_controller/motor.md
    - 电源:
      - PMU Lite: hardware/power/pmu-lite.md
      - 50PL_6S2P: hardware/power/50PL_6S2P.md
      - 格氏电池: hardware/power/geshi_battery.md 
    - 机载计算机:
        - Jetson Orin NX: hardware/computer/jetson-orin-nx.md
    - 电源树:
      - 电源树设计: hardware/power_tree/power-tree-design.md
      - 电源树连接: hardware/power_tree/power-tree-connection.md
    - 线路连接:
      - 线路连接说明: hardware/wiring/wiring.md
  - 机载计算机配置:
    - 引导烧录: jetson/boot.md
    - 系统安装: jetson/system-install.md
    - ROS安装: jetson/ros-install.md
    - 任务控制器: jetson/task-controller.md
  - 软件功能包:
    - 无人机状态机: software/px4_controller/state-machine.md
    - PX4接口: software/px4_controller/px4-interface.md
    - 瞄准与跟踪: software/px4_controller/aiming-tracking.md
    - 侦察: software/px4_controller/detection.md
    - 投放: software/px4_controller/throw.md
    - 位置发布: software/px4_controller/position-publish.md
  - 自定义地面站软件:
    - QSQ Groundcontrol:
      - 软件简介: software/QSQ_Groundcontrol/introduction.md
      - 软件安装: software/QSQ_Groundcontrol/install.md
      - 软件使用: software/QSQ_Groundcontrol/use.md
      - 更新日志: software/QSQ_Groundcontrol/changelog.md
      - 自定义开发:
        - 源码获取: software/QSQ_Groundcontrol/development.md
        - 编译环境配置: software/QSQ_Groundcontrol/development-env.md
        - 编译与运行: software/QSQ_Groundcontrol/development-build.md
        - 打包与发行: software/QSQ_Groundcontrol/development-package.md
    - 无人机控制台: software/upper_machine/drone-console.md
    - 数据遥测: software/upper_machine/data-telemetry.md

# ============================================================
# 插件配置
# ============================================================
plugins:
  - search:
      lang: zh
  - i18n:
      default_language: zh
      languages:
        zh: 中文
        en: English

# ============================================================
# 扩展CSS与JavaScript
# ============================================================
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# ============================================================
# 额外配置
# ============================================================
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SIANQSQ/Drone_Task_Controller.git
  copyright: Copyright &copy; 2026 DUT Aeromodelling Association - Shengqiao Qu
  analytics:
    provider: google
    property: G-XXXXXXXXXX

# ============================================================
# 构建与预览设置
# ============================================================
docs_dir: docs
site_dir: site
dev_addr: 127.0.0.1:8000
strict: false
use_directory_urls: true

# ============================================================
# Markdown扩展配置
# ============================================================
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
